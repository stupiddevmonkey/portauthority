name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
      image-tag: ${{ steps.version.outputs.image-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate SemVer and prepare image name
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG;
          const number = '(?:0|[1-9][0-9]*)';
          const identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)';
          const semver = new RegExp(`^v${number}\\.${number}\\.${number}(?:-(${identifier}(?:\\.${identifier})*))?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`);
          const match = semver.exec(tag);
          if (!match) {
            throw new Error(`Invalid release tag "${tag}". Use vMAJOR.MINOR.PATCH with optional SemVer prerelease and build metadata.`);
          }

          // Docker tags cannot contain the SemVer build metadata separator.
          const imageTag = tag.slice(1).replace('+', '_');
          if (imageTag.length > 128) {
            throw new Error('The version exceeds Docker\'s 128-character image tag limit.');
          }
          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `image=${image}`,
            `image-tag=${imageTag}`,
            `prerelease=${Boolean(match[1])}`,
            ''
          ].join('\n'));
          NODE

  test:
    name: Test release (Node.js ${{ matrix.node }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test

  publish:
    name: Publish image and GitHub Release
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.image-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          IMAGE: ${{ needs.version.outputs.image }}
          IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          notes="$(printf 'Docker image (linux/amd64): `%s:%s`\n\nDigest: `%s@%s`' "$IMAGE" "$IMAGE_TAG" "$IMAGE" "$IMAGE_DIGEST")"
          gh release create "$RELEASE_TAG" "${args[@]}" --notes "$notes"
